name: CD - Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - promote-to-green
          - swap-green-production

jobs:
  lint-build-test:
    if: github.event_name == 'push' || github.event.inputs.action == 'promote-to-green'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
      - run: npm run test:coverage

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Start dev server for E2E tests
        run: npm start & npx wait-on http://localhost:4200

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/clinicx-talent

  deploy-uat:
    if: github.event_name == 'push'
    needs: lint-build-test
    environment:
      name: uat
      url: https://uat.clinicxtalent.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Azure (UAT)
        uses: azure/webapps-deploy@v3
        with:
          app-name: clinicxtalent-uat
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_UAT }}
          package: dist/clinicx-talent/browser

  promote-green:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'promote-to-green'
    needs: lint-build-test
    environment:
      name: production
      url: https://clinicxtalent.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to production green slot
        uses: azure/webapps-deploy@v3
        with:
          app-name: clinicxtalent
          slot-name: green
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: dist/clinicx-talent/browser

  swap-slots:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'swap-green-production'
    environment:
      name: production
      url: https://clinicxtalent.com
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Swap green ↔ production
        run: |
          az webapp deployment slot swap \
            --name clinicxtalent \
            --resource-group clinicx \
            --slot green \
            --target-slot production
