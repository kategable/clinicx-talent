# ClinicX Talent — Local development stack
#
#   docker compose up            Start everything (DB + API + Angular)
#   docker compose up postgres api  Start just the backend
#   docker compose down          Stop and remove containers
#
# Prerequisites: Docker with Compose (OrbStack, Docker Desktop, or Colima)

services:
  # -- PostgreSQL 16 ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: clinicx-postgres
    environment:
      POSTGRES_DB: clinicx
      POSTGRES_USER: clinicx
      POSTGRES_PASSWORD: clinicx_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clinicx -d clinicx']
      interval: 5s
      timeout: 3s
      retries: 5

  # -- ASP.NET Core API ------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: backend/src/ClinicX.Api/Dockerfile
    container_name: clinicx-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ClinicXDb: Host=postgres;Database=clinicx;Username=clinicx;Password=clinicx_dev
    ports:
      - '5001:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -- Angular dev server ----------------------------------------------------
  web:
    image: node:24-alpine
    container_name: clinicx-web
    working_dir: /app
    command: sh -c "npm ci --legacy-peer-deps && npm start -- --host 0.0.0.0"
    ports:
      - '4200:4200'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  node_modules:
